<script>
// light (watercolour on paper) unless dark (space) was chosen, as on the home page
(() => { let t = "light"; try { t = localStorage.getItem("v2-theme") || "light"; } catch {}
  const q = new URLSearchParams(location.search); if (q.has("paint")) t = "light"; if (q.has("space")) t = "dark";
  if (t === "light") document.documentElement.classList.add("paint");
  // the browser's own bars take the page's colour: paper, or space
  document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#F4EEE4" : "#050507"; })();
</script>

<style>
  body { min-height: 100vh; }
  /* The flood from the warp arrives full-screen, then settles into the hero band */
  .band { position: fixed; inset: 0 0 auto 0; height: 100vh; background: var(--c); z-index: 0; display: none; }
  .legacy-case .band { display: block; }
  .band::after { content: ""; position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(to bottom, transparent, var(--space)); opacity: 0; transition: opacity 1.2s ease; }
  .settled .band::after { opacity: 1; }
  .case { position: relative; z-index: 1; padding: 22vh var(--gutter) 12vh; max-width: 1100px; }
  .case .pos { font: 400 11px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 255, 255, .7); }
  .case h1 { font-family: var(--display); font-weight: 400; font-size: clamp(72px, 13vw, 200px); line-height: .9; letter-spacing: -.03em; margin: 14px 0 22px; font-variation-settings: "opsz" 96; }
  .case .lede { font-size: clamp(19px, 2vw, 26px); line-height: 1.3; letter-spacing: -.02em; max-width: 30ch; }
  .meta { display: flex; flex-wrap: wrap; gap: 12px 48px; margin-top: 48px; }
  .meta dt { font: 400 11px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 255, 255, .6); }
  .meta dd { font-size: 15px; margin-top: 4px; }
  .case-top { position: fixed; z-index: 5; top: calc(var(--gutter) + env(safe-area-inset-top, 0px)); right: var(--gutter); font: 400 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .case-top .theme { color: inherit; }
  .top .mark { position: fixed; top: calc(var(--gutter) + env(safe-area-inset-top, 0px)); left: var(--gutter); z-index: 5; }
  .case > * { opacity: 0; transform: translateY(18px); }
</style>

</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="module">
  import { PROJECTS_COPY, CASE_SECTIONS } from "./content.js?v=4a4f1d91";
  const slug = new URLSearchParams(location.search).get("p") || "reta";
  const names = Object.keys(PROJECTS_COPY);
  const i = Math.max(0, names.findIndex((n) => PROJECTS_COPY[n].slug === slug));
  const name = names[i], c = PROJECTS_COPY[name];
  const COLORS = { RETA: "#7A00D9", Viberist: "#3F62F2", SheTrades: "#F18671", Mori: "#7D2327", FitCoach: "#2A2B2F", Tradelink: "#2B6FFF", "Selangor FC": "#B5141E" };
  document.title = `${name} — Arieff Hizer`;
  // the description follows the project (people who share a case study from a browser get the right one)
  for (const sel of ['meta[name="description"]', 'meta[property="og:description"]']) document.querySelector(sel).content = `${name}: ${c.line} A case study by Arieff Hizer, product designer.`;
  document.querySelector('meta[property="og:title"]').content = document.title;
  document.documentElement.style.setProperty("--c", COLORS[name]);
  document.querySelector(".pos").textContent = `${String(i + 1).padStart(2, "0")} / 0${names.length} · Case study`;
  document.querySelector("h1").textContent = name;
  document.querySelector(".lede").textContent = c.line;
  document.querySelector(".meta").innerHTML = Object.entries(c.meta).map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  document.querySelector(".back").href = `index.html#${c.slug}`;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // the planet-horizon layout, on trial with the projects that have sections written
  if (CASE_SECTIONS[c.slug]) {
    const { startPlanetCase } = await import("./case-planet.js?v=4a4f1d91");
    startPlanetCase({ name, copy: c, sections: CASE_SECTIONS[c.slug], index: i, total: names.length });
  } else {
  document.body.classList.add("legacy-case");
  gsap.to(".band", { height: "68vh", duration: reduce ? 0 : 1.3, ease: "expo.inOut", delay: 0.2, onStart: () => document.body.classList.add("settled") });
  gsap.to(".case > *", { opacity: 1, y: 0, duration: reduce ? 0 : 0.9, ease: "power3.out", stagger: 0.08, delay: 0.55 });
  }
</script>
</body>
